<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Cuarta Compañía Bomberos San Pablo</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            @page { margin: 1cm; size: auto; }
            body { margin: 0px; background: white; }
            main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .acta-print-container { border: none !important; box-shadow: none !important; }
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }

        .editor-content {
            min-height: 400px;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .editor-content b, .editor-content strong { font-weight: bold; }
        .editor-content i, .editor-content em { font-style: italic; }
        .editor-content strike { text-decoration: line-through; }
        
        .editor-content:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            cursor: text;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            background-color: #ffffff;
            ring: 2px;
            ring-color: #fee2e2;
            border-color: #ef4444;
        }
        label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-left: 0.25rem;
            margin-bottom: 0.25rem;
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name }) => {
            const icons = {
                users: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
                file: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
                truck: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path></svg>,
                folder: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>,
                save: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
                print: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
                trash: <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
                upload: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
                logout: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
                plus: <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
                bold: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M15.6 11.8c1-.7 1.6-1.8 1.6-2.8 0-2.2-1.8-4-4-4H7v14h7c2.2 0 4-1.8 4-4 0-1.5-.8-2.7-2.4-3.2zM10.2 8h3c.7 0 1.2.5 1.2 1.2s-.5 1.2-1.2 1.2h-3V8zm3.8 8h-3.8v-2.5h3.8c.7 0 1.2.5 1.2 1.2s-.5 1.3-1.2 1.3z"/></svg>,
                italic: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 5v3h2.2l-3.4 8H6v3h8v-3h-2.2l3.4-8H18V5z"/></svg>,
                strike: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 19h4v-3h-4v3zM5 4v3h5v3H5v3h5v3H5v3h14v-3h-5v-3h5v-3h-5V7h5V4H5z"/></svg>,
                left: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>,
                center: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4-4v2h18v-2H3zm4-4v2h10V7H7zm-4-4v2h18V3H3zm4 18v2h10v-2H7z"/></svg>,
                right: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M9 15v2h12v-2H9zm0-8v2h12V7H9zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
            };
            return icons[name] || null;
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('bomberos_auth') === 'true');
            const [credentials, setCredentials] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState(false);
            const [activeTab, setActiveTab] = useState('actas');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [toast, setToast] = useState({ show: false, message: '' });
            const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
            
            const editorRef = useRef(null);

            // Datos persistentes
            const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('bomberos_members')) || []);
            const [actasHistory, setActasHistory] = useState(() => JSON.parse(localStorage.getItem('bomberos_actas')) || []);
            const [bitacoraFiles, setBitacoraFiles] = useState(() => JSON.parse(localStorage.getItem('bomberos_bitacora')) || []);

            const unitsList = ["BR-4"];
            const [unitStatus, setUnitStatus] = useState(() => JSON.parse(localStorage.getItem('bomberos_units')) || 
                unitsList.reduce((acc, unit) => ({ ...acc, [unit]: "0-8" }), {})
            );

            const [actaMeta, setActaMeta] = useState({ title: '', date: new Date().toISOString().split('T')[0] });
            
            // Estado para nuevo socio ampliado
            const initialMemberState = { 
                name: '', 
                rut: '', 
                address: '', 
                commune: 'San Pablo', 
                province: 'Osorno', 
                region: 'Los Lagos', 
                role: 'Voluntario', 
                pos: '', 
                keyNumber: '' 
            };
            const [newMember, setNewMember] = useState(initialMemberState);

            useEffect(() => { localStorage.setItem('bomberos_members', JSON.stringify(members)); }, [members]);
            useEffect(() => { localStorage.setItem('bomberos_actas', JSON.stringify(actasHistory)); }, [actasHistory]);
            useEffect(() => { localStorage.setItem('bomberos_bitacora', JSON.stringify(bitacoraFiles)); }, [bitacoraFiles]);
            useEffect(() => { localStorage.setItem('bomberos_units', JSON.stringify(unitStatus)); }, [unitStatus]);
            useEffect(() => { localStorage.setItem('bomberos_auth', isLoggedIn); }, [isLoggedIn]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (credentials.username === "Admin" && credentials.password === "4ta2026") {
                    setIsLoggedIn(true);
                    setLoginError(false);
                } else {
                    setLoginError(true);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setShowLogoutConfirm(false);
            };

            const showToast = (message) => {
                setToast({ show: true, message });
                setTimeout(() => setToast({ show: false, message: '' }), 3000);
            };

            const formatText = (command, value = null) => {
                document.execCommand(command, false, value);
                if (editorRef.current) editorRef.current.focus();
            };

            const saveActa = () => {
                const content = editorRef.current ? editorRef.current.innerHTML : "";
                if(!actaMeta.title || !content || content === "<br>") {
                    return showToast("Complete título y desarrollo");
                }
                const newActa = { ...actaMeta, content, id: Date.now() };
                setActasHistory([newActa, ...actasHistory]);
                setActaMeta({ title: '', date: new Date().toISOString().split('T')[0] });
                if (editorRef.current) editorRef.current.innerHTML = "";
                showToast("Acta guardada correctamente");
            };

            const loadActaFromHistory = (item) => {
                setActaMeta({ title: item.title, date: item.date });
                if (editorRef.current) editorRef.current.innerHTML = item.content;
                showToast("Acta cargada");
            };

            const addMember = (e) => {
                e.preventDefault();
                if(!newMember.name || !newMember.rut) return showToast("Faltan datos obligatorios");
                setMembers([...members, { ...newMember, id: Date.now() }]);
                setNewMember(initialMemberState);
                showToast("Socio registrado con éxito");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const newEntry = {
                        id: Date.now(),
                        name: file.name,
                        date: new Date().toLocaleString(),
                        preview: file.type.startsWith('image/') ? event.target.result : null,
                        size: (file.size / 1024).toFixed(1) + ' KB'
                    };
                    setBitacoraFiles([newEntry, ...bitacoraFiles]);
                    showToast("Archivo añadido");
                };
                reader.readAsDataURL(file);
            };

            if (!isLoggedIn) {
                return (
                    <div className="fixed inset-0 flex items-center justify-center bg-slate-900 px-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-8 border-red-700">
                            <div className="w-20 h-20 bg-red-700 text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4 border-4 border-red-100">4</div>
                            <h1 className="text-2xl font-bold text-red-800 uppercase">Cuarta Compañía</h1>
                            <p className="text-slate-500 mb-8 font-medium italic">San Pablo - Los Lagos</p>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" placeholder="Usuario" className="input-field" value={credentials.username} onChange={e => setCredentials({...credentials, username: e.target.value})} />
                                <input type="password" placeholder="Contraseña" className="input-field" value={credentials.password} onChange={e => setCredentials({...credentials, password: e.target.value})} />
                                <button className="w-full bg-red-700 text-white py-3 rounded-xl font-bold hover:bg-red-800 transition-all shadow-lg active:scale-95">ACCEDER AL SISTEMA</button>
                            </form>
                            {loginError && <p className="text-red-600 mt-4 text-sm font-bold animate-pulse">Credenciales incorrectas</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-10">
                    <nav className="bg-red-700 text-white p-4 shadow-lg sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-red-700 font-black shadow-inner">4</div>
                                <span className="font-bold text-lg hidden sm:inline">Bomberos San Pablo</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-xs font-bold opacity-80 hidden md:block">{currentTime.toLocaleTimeString()}</span>
                                <button onClick={() => setShowLogoutConfirm(true)} className="bg-red-800 hover:bg-red-900 px-4 py-2 rounded-lg transition-colors flex items-center gap-2 border border-red-400/30">
                                    <Icon name="logout" /> <span className="hidden sm:inline">Salir</span>
                                </button>
                            </div>
                        </div>
                    </nav>

                    {showLogoutConfirm && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center px-4 modal-overlay">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
                                <h2 className="text-xl font-bold mb-4 text-slate-800">¿Cerrar sesión de gestión?</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setShowLogoutConfirm(false)} className="py-3 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Cancelar</button>
                                    <button onClick={handleLogout} className="py-3 bg-red-700 text-white hover:bg-red-800 rounded-xl font-bold transition-colors">Cerrar Sesión</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                        <div className="flex gap-2 overflow-x-auto pb-2 no-print scrollbar-hide">
                            {['actas', 'personal', 'operatividad', 'archivos'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-xl font-bold transition-all border ${activeTab === tab ? 'bg-white text-red-700 border-red-200 shadow-sm' : 'text-slate-400 border-transparent hover:bg-slate-100'}`}>
                                    <Icon name={tab === 'actas' ? 'file' : tab === 'personal' ? 'users' : tab === 'operatividad' ? 'truck' : 'folder'} />
                                    <span className="capitalize">{tab === 'archivos' ? 'Bitácora' : tab}</span>
                                </button>
                            ))}
                        </div>

                        {activeTab === 'actas' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                                <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 acta-print-container">
                                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2 border-b pb-2 text-slate-800 uppercase tracking-tighter">Sesión de Compañía</h2>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 no-print">
                                        <div className="md:col-span-2">
                                            <label>Título de la Sesión</label>
                                            <input type="text" placeholder="Ej: Asamblea Ordinaria de Enero" className="input-field" value={actaMeta.title} onChange={e => setActaMeta({...actaMeta, title: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Fecha</label>
                                            <input type="date" className="input-field" value={actaMeta.date} onChange={e => setActaMeta({...actaMeta, date: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="hidden print-only mb-6 text-center">
                                        <h1 className="text-2xl font-bold underline uppercase">{actaMeta.title || 'SIN TÍTULO'}</h1>
                                        <p className="text-right font-bold mt-2">FECHA DE REUNIÓN: {actaMeta.date}</p>
                                    </div>

                                    <div className="no-print mb-2 p-2 bg-slate-100 rounded-xl flex flex-wrap gap-1 border border-slate-200">
                                        <button onClick={() => formatText('bold')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="bold"/></button>
                                        <button onClick={() => formatText('italic')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="italic"/></button>
                                        <button onClick={() => formatText('strikeThrough')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="strike"/></button>
                                        <div className="w-px h-6 bg-slate-300 mx-1 self-center"></div>
                                        <button onClick={() => formatText('justifyLeft')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="left"/></button>
                                        <button onClick={() => formatText('justifyCenter')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="center"/></button>
                                        <button onClick={() => formatText('justifyRight')} className="p-2 hover:bg-white rounded-lg transition-colors"><Icon name="right"/></button>
                                    </div>

                                    <div 
                                        ref={editorRef}
                                        contentEditable="true"
                                        className="editor-content w-full p-6 border rounded-2xl bg-white shadow-inner font-serif text-lg leading-relaxed focus:ring-2 focus:ring-red-50 focus:border-red-200 transition-all min-h-[500px]"
                                        data-placeholder="Describa el desarrollo de la reunión aquí..."
                                    ></div>

                                    <div className="mt-6 flex flex-wrap gap-3 no-print border-t pt-6">
                                        <button onClick={saveActa} className="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-emerald-700 shadow-md transition-all active:scale-95"><Icon name="save"/> Guardar en Historial</button>
                                        <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-blue-700 shadow-md transition-all active:scale-95"><Icon name="print"/> Imprimir Acta</button>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                                    <h2 className="text-lg font-bold mb-4 text-slate-700 border-b pb-2 uppercase tracking-widest">Historial Reciente</h2>
                                    <div className="space-y-3 max-h-[700px] overflow-y-auto pr-2 scrollbar-hide">
                                        {actasHistory.length === 0 && <p className="text-slate-400 text-center py-10 italic">No hay actas guardadas</p>}
                                        {actasHistory.map(item => (
                                            <div key={item.id} className="p-4 bg-slate-50 rounded-xl border hover:border-red-300 group transition-all cursor-pointer" onClick={() => loadActaFromHistory(item)}>
                                                <div className="flex justify-between items-start">
                                                    <span className="text-[10px] font-bold text-red-600 uppercase">{item.date}</span>
                                                    <button onClick={(e) => {e.stopPropagation(); setActasHistory(actasHistory.filter(a => a.id !== item.id))}} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash"/></button>
                                                </div>
                                                <h3 className="font-bold text-slate-800 line-clamp-1 mt-1 uppercase text-sm">{item.title}</h3>
                                                <p className="text-[10px] text-slate-400 mt-2 font-bold italic">Clic para cargar...</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'personal' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 no-print">
                                    <h2 className="text-xl font-black mb-8 text-slate-800 uppercase tracking-tighter flex items-center gap-3">
                                        <div className="w-8 h-8 bg-red-100 text-red-700 rounded-lg flex items-center justify-center"><Icon name="plus"/></div>
                                        Registro de Personal y Socios
                                    </h2>
                                    <form onSubmit={addMember} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        <div className="lg:col-span-2">
                                            <label>Nombre Completo del Socio</label>
                                            <input type="text" placeholder="Ej: Juan Antonio Pérez González" className="input-field" value={newMember.name} onChange={e => setNewMember({...newMember, name: e.target.value})} required />
                                        </div>
                                        <div>
                                            <label>RUT</label>
                                            <input type="text" placeholder="12.345.678-9" className="input-field" value={newMember.rut} onChange={e => setNewMember({...newMember, rut: e.target.value})} required />
                                        </div>
                                        <div>
                                            <label>Número Clave / Radial</label>
                                            <input type="text" placeholder="Ej: 4-01" className="input-field font-mono font-bold text-red-700" value={newMember.keyNumber} onChange={e => setNewMember({...newMember, keyNumber: e.target.value})} />
                                        </div>
                                        <div className="lg:col-span-2">
                                            <label>Domicilio</label>
                                            <input type="text" placeholder="Calle, número, villa/población" className="input-field" value={newMember.address} onChange={e => setNewMember({...newMember, address: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Comuna</label>
                                            <input type="text" className="input-field" value={newMember.commune} onChange={e => setNewMember({...newMember, commune: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Provincia</label>
                                            <input type="text" className="input-field" value={newMember.province} onChange={e => setNewMember({...newMember, province: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Región</label>
                                            <input type="text" className="input-field" value={newMember.region} onChange={e => setNewMember({...newMember, region: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Cargo / Función</label>
                                            <input type="text" placeholder="Ej: Capitán, Secretario, Voluntario" className="input-field" value={newMember.pos} onChange={e => setNewMember({...newMember, pos: e.target.value})} />
                                        </div>
                                        <div>
                                            <label>Tipo de Socio</label>
                                            <select className="input-field" value={newMember.role} onChange={e => setNewMember({...newMember, role: e.target.value})}>
                                                <option value="Voluntario">Voluntario</option>
                                                <option value="Oficiales">Oficial</option>
                                                <option value="Directiva">Directiva</option>
                                                <option value="Honorario">Honorario</option>
                                                <option value="Cadete">Cadete</option>
                                            </select>
                                        </div>
                                        <div className="flex items-end">
                                            <button type="submit" className="w-full bg-red-700 text-white p-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition-all uppercase tracking-widest text-xs active:scale-95">Registrar Socio</button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white p-0 rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-6 bg-slate-800 text-white flex justify-between items-center no-print">
                                        <h2 className="font-bold uppercase tracking-widest text-sm">Escalafón General de Compañía</h2>
                                        <button onClick={() => window.print()} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 border border-white/20"><Icon name="print"/> Imprimir Lista</button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-100 border-b">
                                                    <th className="p-4 text-[10px] font-black text-slate-500 uppercase">Clave</th>
                                                    <th className="p-4 text-[10px] font-black text-slate-500 uppercase">Nombre Completo / RUT</th>
                                                    <th className="p-4 text-[10px] font-black text-slate-500 uppercase">Ubicación</th>
                                                    <th className="p-4 text-[10px] font-black text-slate-500 uppercase">Cargo</th>
                                                    <th className="p-4 text-[10px] font-black text-slate-500 uppercase no-print"></th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {members.length === 0 ? (
                                                    <tr><td colSpan="5" className="p-10 text-center text-slate-400 italic font-medium">No hay registros en la base de datos</td></tr>
                                                ) : (
                                                    members.map(m => (
                                                        <tr key={m.id} className="hover:bg-slate-50/50 transition-colors">
                                                            <td className="p-4">
                                                                <span className="font-black text-red-700 font-mono bg-red-50 px-3 py-1 rounded-lg border border-red-100">{m.keyNumber || '---'}</span>
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="font-bold text-slate-800">{m.name}</div>
                                                                <div className="text-[10px] font-bold text-slate-400 font-mono">{m.rut}</div>
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="text-xs text-slate-700 font-medium">{m.address}</div>
                                                                <div className="text-[9px] font-black text-slate-400 uppercase">{m.commune} • {m.province}</div>
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`inline-block px-2 py-0.5 rounded text-[9px] font-bold uppercase mb-1 ${m.role === 'Oficiales' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-blue-100 text-blue-700 border border-blue-200'}`}>{m.role}</span>
                                                                <div className="text-[10px] font-black text-slate-500 uppercase">{m.pos || '---'}</div>
                                                            </td>
                                                            <td className="p-4 text-right no-print">
                                                                <button onClick={() => setMembers(members.filter(x => x.id !== m.id))} className="text-slate-300 hover:text-red-600 p-2 transition-colors"><Icon name="trash"/></button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'operatividad' && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 animate-fadeIn">
                                <h2 className="text-xl font-black mb-8 text-slate-800 uppercase tracking-tighter border-b pb-4">Disponibilidad de Material Mayor</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-6">
                                    {unitsList.map(unit => (
                                        <div key={unit} className={`p-6 rounded-3xl border-2 text-center transition-all shadow-sm ${unitStatus[unit] === '0-8' ? 'bg-emerald-50 border-emerald-200 ring-4 ring-emerald-50' : 'bg-red-50 border-red-200 ring-4 ring-red-50'}`}>
                                            <div className="font-black text-3xl mb-3 text-slate-800 tracking-tighter">{unit}</div>
                                            <select value={unitStatus[unit]} onChange={e => {setUnitStatus({...unitStatus, [unit]: e.target.value}); showToast(unit + " actualizado")}} 
                                                className="w-full text-[10px] p-2 border-2 rounded-xl font-black uppercase bg-white cursor-pointer shadow-sm outline-none focus:border-slate-800 transition-all">
                                                <option value="0-8">0-8 (Disponible)</option>
                                                <option value="0-9">0-9 (F. Servicio)</option>
                                                <option value="6-13">6-13 (Ocupado)</option>
                                            </select>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'archivos' && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 animate-fadeIn">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b pb-4">
                                    <h2 className="text-xl font-black text-slate-800 uppercase tracking-tighter">Bitácora Multimedia</h2> 
                                    <label className="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold cursor-pointer hover:bg-slate-800 flex items-center gap-2 shadow-xl transition-all active:scale-95">
                                        <Icon name="upload"/> Subir Registro
                                        <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                {bitacoraFiles.length === 0 ? (
                                    <div className="text-center py-20 border-4 border-dashed rounded-3xl bg-slate-50 text-slate-400">
                                        <div className="mb-4 flex justify-center scale-150"><Icon name="folder"/></div>
                                        <p className="font-black uppercase tracking-widest text-xs">Sin archivos cargados en la bitácora</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                        {bitacoraFiles.map(file => (
                                            <div key={file.id} className="bg-white border-2 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all group">
                                                <div className="h-48 bg-slate-100 relative">
                                                    {file.preview ? (
                                                        <img src={file.preview} className="w-full h-full object-cover" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="file"/></div>
                                                    )}
                                                    <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-all">
                                                        <button onClick={() => setBitacoraFiles(bitacoraFiles.filter(f => f.id !== file.id))} className="bg-red-600 text-white p-2 rounded-lg shadow-lg hover:bg-red-700"><Icon name="trash"/></button>
                                                    </div>
                                                </div>
                                                <div className="p-4">
                                                    <h3 className="font-bold text-slate-800 text-xs truncate uppercase tracking-tighter">{file.name}</h3>
                                                    <div className="mt-2 flex justify-between items-center">
                                                        <span className="text-[10px] font-bold text-slate-400">{file.date}</span>
                                                        <span className="text-[10px] font-black text-slate-600 bg-slate-100 px-2 py-0.5 rounded uppercase">{file.size}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="text-center mt-10 no-print">
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em]">Sistema Oficial de Gestión Interna • Cuarta Compañía</p>
                    </footer>

                    <div className={`fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl transition-all flex items-center gap-3 z-50 ${toast.show ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                        <div className="w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                        <span className="text-xs font-black uppercase tracking-widest">{toast.message}</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
